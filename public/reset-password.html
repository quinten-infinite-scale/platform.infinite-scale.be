<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · Infinite Scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: oklch(0.165 0.012 256);
    --bg-2: oklch(0.195 0.013 256);
    --surface: oklch(0.215 0.014 256);
    --surface-2: oklch(0.255 0.015 256);
    --surface-3: oklch(0.30 0.016 256);
    --border: oklch(0.32 0.016 256);
    --border-soft: oklch(0.27 0.014 256);
    --text: oklch(0.97 0.004 256);
    --text-dim: oklch(0.76 0.012 256);
    --text-mute: oklch(0.58 0.014 256);
    --accent: oklch(0.84 0.16 194);
    --accent-press: oklch(0.72 0.17 194);
    --accent-ink: oklch(0.18 0.07 194);
    --up: oklch(0.80 0.16 152);
    --down: oklch(0.68 0.19 25);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  input,button{ font-family:inherit; }
  @keyframes isp-fade{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  @keyframes isp-spin{ to{transform:rotate(360deg);} }
  .wrap{ min-height:100vh; display:grid; grid-template-columns:1.05fr 1fr; }
  .hero{ position:relative; padding:48px; display:flex; flex-direction:column; justify-content:space-between; background:linear-gradient(150deg,var(--bg-2),var(--bg)); border-right:1px solid var(--border-soft); overflow:hidden; }
  .hero-bg{ position:absolute; inset:0; opacity:.5; background:radial-gradient(900px 500px at 18% 12%,oklch(0.30 0.11 194 / .5),transparent 60%),radial-gradient(700px 500px at 88% 88%,oklch(0.30 0.06 256 / .45),transparent 55%); }
  .hero-logo{ position:relative; display:flex; align-items:center; gap:12px; }
  .hero-tagline{ position:relative; max-width:460px; }
  .right{ display:flex; align-items:center; justify-content:center; padding:40px; }
  .panel{ width:100%; max-width:420px; animation:isp-fade .5s ease both; }
  .isp-input{ padding:11px 14px; border-radius:11px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:14px; outline:none; font-family:inherit; width:100%; }
  .isp-input:focus{ border-color:var(--accent); }
  .isp-btn{ padding:12px 20px; border-radius:11px; border:none; background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:14px; cursor:pointer; width:100%; margin-top:4px; font-family:inherit; }
  .isp-btn:hover{ background:var(--accent-press); }
  .isp-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .isp-label{ display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--text-dim); }
  .isp-error{ padding:10px 13px; border-radius:10px; background:oklch(0.30 0.06 25 / .25); border:1px solid oklch(0.45 0.12 25); font-size:13px; color:var(--down); }
  .isp-success{ padding:10px 13px; border-radius:10px; background:oklch(0.25 0.08 152 / .25); border:1px solid oklch(0.45 0.12 152); font-size:13px; color:var(--up); }
  .isp-info{ margin-top:20px; padding:13px 15px; border-radius:12px; background:var(--bg-2); border:1px solid var(--border-soft); font-size:12.5px; color:var(--text-mute); line-height:1.6; }
  .isp-back{ display:inline-flex; align-items:center; gap:6px; margin-top:20px; font-size:13px; color:var(--text-mute); text-decoration:none; cursor:pointer; background:none; border:none; font-family:inherit; }
  .isp-back:hover{ color:var(--text); }
  .spinner{ width:38px; height:38px; border:3px solid var(--border); border-top:3px solid var(--accent); border-radius:50%; animation:isp-spin 1s linear infinite; margin:0 auto 20px; }
  @media(max-width:900px){ .wrap{grid-template-columns:1fr;} .hero{display:none;} }
</style>
</head>
<body>
<div class="wrap">
  <!-- Left hero panel — unchanged -->
  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-logo">
      <img src="/logo.svg" width="38" height="38" alt="Infinite Scale" style="border-radius:50%;">
      <span style="font-family:'Space Grotesk';font-weight:700;font-size:18px;letter-spacing:-.01em;">Infinite Scale</span>
    </div>
    <div class="hero-tagline">
      <h1 style="font-family:'Space Grotesk';font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-.03em;">Prospects omzetten in klanten. Op schaal.</h1>
    </div>
    <div style="height:120px;"></div>
  </div>

  <!-- Right panel — adapts based on URL state -->
  <div class="right">
    <div class="panel" id="panel">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<script src="./js/config.js"></script>
<script>
(function () {
  const SB_URL = window.SUPABASE_URL;
  const SB_KEY = window.SUPABASE_ANON_KEY;
  const panel  = document.getElementById('panel');

  // Parse URL hash: ?access_token=...&type=recovery OR #access_token=...&type=recovery
  function parseTokens() {
    const raw = window.location.hash.slice(1) || window.location.search.slice(1);
    const p = new URLSearchParams(raw);
    return {
      accessToken:  p.get('access_token'),
      refreshToken: p.get('refresh_token'),
      type:         p.get('type'),
      error:        p.get('error'),
      errorCode:    p.get('error_code'),
      errorDesc:    p.get('error_description'),
    };
  }

  const tok = parseTokens();

  // ---- State: error from Supabase ----
  if (tok.error) {
    const msg = tok.errorDesc
      ? decodeURIComponent(tok.errorDesc.replace(/\+/g, ' '))
      : 'This link is invalid or has expired.';
    panel.innerHTML = `
      <h2 style="font-family:'Space Grotesk';font-weight:600;font-size:26px;margin:0 0 8px;">Link expired</h2>
      <p style="color:var(--text-mute);font-size:14px;margin:0 0 22px;">This reset link can no longer be used.</p>
      <div class="isp-error">${msg}</div>
      <div class="isp-info">Request a new link using the form below, or contact your admin.</div>
      <div style="margin-top:28px;" id="request-form-mount"></div>
      <a href="/" class="isp-back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to sign in
      </a>`;
    mountRequestForm(document.getElementById('request-form-mount'));
    return;
  }

  // ---- State: recovery token present ----
  if (tok.accessToken && tok.type === 'recovery') {
    renderSetPasswordForm(tok.accessToken, tok.refreshToken);
    return;
  }

  // ---- State: default (request reset link) ----
  panel.innerHTML = '';
  mountRequestForm(panel);

  // ---- Forms ----

  function mountRequestForm(container) {
    container.innerHTML = `
      <h2 style="font-family:'Space Grotesk';font-weight:600;font-size:26px;margin:0 0 6px;">Reset password</h2>
      <p style="color:var(--text-mute);font-size:14px;margin:0 0 26px;">Enter your email and we'll send you a reset link.</p>
      <form id="req-form" style="display:flex;flex-direction:column;gap:14px;">
        <label class="isp-label">Email
          <input class="isp-input" type="email" id="req-email" placeholder="you@company.be" required>
        </label>
        <div id="req-msg"></div>
        <button class="isp-btn" type="submit" id="req-btn">Send reset link</button>
      </form>
      <a href="/" class="isp-back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to sign in
      </a>`;

    document.getElementById('req-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('req-email').value.trim();
      const btn   = document.getElementById('req-btn');
      const msg   = document.getElementById('req-msg');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      msg.innerHTML = '';
      try {
        const r = await fetch('/api/send-password-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const d = await r.json();
        if (d.ok) {
          msg.innerHTML = `<div class="isp-success">Check your inbox — an email is on its way to <strong>${email}</strong>.</div>`;
          btn.textContent = 'Sent ✓';
        } else {
          msg.innerHTML = `<div class="isp-error">${d.error || 'Something went wrong. Please try again.'}</div>`;
          btn.disabled = false;
          btn.textContent = 'Send reset link';
        }
      } catch (err) {
        msg.innerHTML = `<div class="isp-error">Network error. Please try again.</div>`;
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    });
  }

  function renderSetPasswordForm(accessToken, refreshToken) {
    panel.innerHTML = `
      <h2 style="font-family:'Space Grotesk';font-weight:600;font-size:26px;margin:0 0 6px;">Set new password</h2>
      <p style="color:var(--text-mute);font-size:14px;margin:0 0 26px;">Choose a strong password for your account.</p>
      <form id="set-form" style="display:flex;flex-direction:column;gap:14px;">
        <label class="isp-label">New password
          <input class="isp-input" type="password" id="set-pw" placeholder="Min. 8 characters" required minlength="8">
        </label>
        <label class="isp-label">Confirm password
          <input class="isp-input" type="password" id="set-pw2" placeholder="Repeat password" required minlength="8">
        </label>
        <div id="set-msg"></div>
        <button class="isp-btn" type="submit" id="set-btn">Save new password</button>
      </form>`;

    document.getElementById('set-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const pw  = document.getElementById('set-pw').value;
      const pw2 = document.getElementById('set-pw2').value;
      const btn = document.getElementById('set-btn');
      const msg = document.getElementById('set-msg');
      msg.innerHTML = '';
      if (pw !== pw2) {
        msg.innerHTML = '<div class="isp-error">Passwords do not match.</div>';
        return;
      }
      if (pw.length < 8) {
        msg.innerHTML = '<div class="isp-error">Password must be at least 8 characters.</div>';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        // Use the recovery access token to update the password
        const r = await fetch(`${SB_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'apikey': SB_KEY,
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ password: pw }),
        });
        const d = await r.json();
        if (r.ok && d.id) {
          msg.innerHTML = '<div class="isp-success">Password updated! Redirecting to sign in…</div>';
          // Clear the hash so the token isn't reused
          history.replaceState(null, '', '/reset-password');
          setTimeout(() => { window.location.href = '/'; }, 1800);
        } else {
          const errMsg = d?.msg || d?.message || 'Update failed. This link may have expired.';
          msg.innerHTML = `<div class="isp-error">${errMsg}</div>`;
          btn.disabled = false;
          btn.textContent = 'Save new password';
        }
      } catch (err) {
        msg.innerHTML = '<div class="isp-error">Network error. Please try again.</div>';
        btn.disabled = false;
        btn.textContent = 'Save new password';
      }
    });
  }
})();
</script>
</body>
</html>
